name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project files
        run: flutter create --platforms=android --org ir.amiriview .
      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          changed = False
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              updated = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              updated = updated.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              if updated != text:
                  path.write_text(updated)
                  changed = True
          if not changed:
              raise SystemExit("Could not find Flutter compileSdk setting in Android app Gradle file")
          PY
      - name: Configure Android plugin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/build.gradle.kts")
          if not path.exists():
              raise SystemExit("Expected Kotlin DSL root Gradle file was not generated")

          text = path.read_text()
          marker = "// AMIRI_ANDROID_PLUGIN_COMPATIBILITY"
          if marker not in text:
              text += """
          
          // AMIRI_ANDROID_PLUGIN_COMPATIBILITY
          // Apply Kotlin Android to the affected legacy Flutter plugins before Android plugin configuration.
          gradle.beforeProject(object : org.gradle.api.Action<org.gradle.api.Project> {
              override fun execute(sub: org.gradle.api.Project) {
                  if (sub.name == "file_picker" || sub.name == "share_plus") {
                      sub.pluginManager.withPlugin("com.android.library") {
                          sub.pluginManager.apply("org.jetbrains.kotlin.android")
                      }
                  }
              }
          })
          
          // Configure compileSdk only when the Android library plugin is present.
          subprojects {
              pluginManager.withPlugin("com.android.library") {
                  val androidExtension = extensions.findByName("android")
                      ?: throw GradleException("Android extension not found for $name")
                  val compileSdkSetter = androidExtension.javaClass.methods.firstOrNull {
                      (it.name == "setCompileSdk" || it.name == "setCompileSdkVersion") &&
                          it.parameterCount == 1 &&
                          it.parameterTypes[0] == Int::class.javaPrimitiveType
                  } ?: throw GradleException("No compatible compileSdk setter found for $name")
                  compileSdkSetter.invoke(androidExtension, 36)
              }
          }
          """
              path.write_text(text)
          PY
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: daftarkar-man-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
